# LiteLLM 网关层 —— 叠加在基础 docker-compose.yml 之上
#
# 这一层负责对外的身份与配额：
#   - 每个用户/团队一把虚拟 key（sk-xxx），由管理员签发
#   - 身份写在 key 的 metadata.trusted_user_id 里，由服务端解析，不看客户端请求头
#   - 每把 key 的 rpm / tpm / 预算 / 并发上限各自独立，互不影响
#
# 分工：LiteLLM 认证与限额，Proxy 负责账号池调度。两者职责分离，
# Proxy 作为内部服务只接受来自 LiteLLM 的调用。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.litellm.yml -f docker-compose.caddy.yml up -d

services:
  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    image: ghcp-litellm:local
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      REDIS_HOST: litellm-redis
      REDIS_PORT: "6379"
      # 指向池化 Proxy —— LiteLLM 是唯一调用 Proxy 的客户端
      GHCP_PROXY_BASE_URL: http://proxy:3000
      GHCP_PROXY_API_KEY: ${API_KEY}
      STORE_MODEL_IN_DB: "False"
      # 管理后台登录凭据。不设则回落为 admin + LITELLM_MASTER_KEY，
      # 建议显式设置，把后台登录和 master key 解耦。
      UI_USERNAME: "${LITELLM_UI_USERNAME:-admin}"
      UI_PASSWORD: "${LITELLM_UI_PASSWORD:-${LITELLM_MASTER_KEY}}"
    ports:
      # 同样只绑回环地址，对外经 Caddy 的 api.<域名>
      - "${BIND_ADDR:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  litellm-db-data:
