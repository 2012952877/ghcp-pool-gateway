# LiteLLM 网关配置 —— 单机 docker-compose 版
#
# 与生产 AKS 版的差异：
#   - Redis 去掉 ssl（容器内网通信，无需 TLS）
#   - 其余保持一致
#
# 关键：litellm_settings.callbacks 里的 trusted_identity_hook 是安全边界。
# 它会删掉客户端传来的所有 X-User-Identity 头，改用虚拟 key 元数据里的
# trusted_user_id 强制注入 —— 没有它，任何持 key 的人都能冒充任意身份。

model_list:
  - model_name: "claude-*"
    litellm_params:
      model: anthropic/claude-*
      api_base: os.environ/GHCP_PROXY_BASE_URL
      api_key: os.environ/GHCP_PROXY_API_KEY
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: os.environ/GHCP_PROXY_BASE_URL
      api_key: os.environ/GHCP_PROXY_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_connection_pool_limit: 4
  proxy_batch_write_at: 60
  disable_error_logs: true
  store_model_in_db: false
  allow_requests_on_db_unavailable: false
  # 不透传客户端头 —— 与 trusted_identity_hook 配合，杜绝身份伪造
  forward_client_headers_to_llm_api: false
  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  # 建 key 时能填的上限（护栏，不是运行时限流）
  upperbound_key_generate_params:
    duration: 90d
    max_budget: 500
    budget_duration: 30d
    max_parallel_requests: 20
    rpm_limit: 600
    tpm_limit: 1000000

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  strip_anthropic_total_tokens: true
  callbacks:
    - trusted_identity_hook.trusted_identity_hook
  # ⚠️ 不要打开 LiteLLM 自己的响应缓存（cache: true）。
  #
  # 实测（tests/cache-cross-account.mjs）：打开后，内容相同的请求会直接返回
  # Redis 里存的旧响应 —— 连 message id 都一模一样，请求根本不到上游。带来三个问题：
  #   1. 跨租户共享：租户 B 发出与租户 A 相同的请求会拿到 A 那次的响应
  #   2. 计费失真：重放的 usage 是第一次的数字，per-key 消费统计不准
  #   3. 掩盖真实缓存：看到的 cache_read/cache_write 全是陈旧值，
  #      无法判断 Anthropic 侧的 prompt 缓存是否真的命中
  #
  # 我们要的是 Anthropic 的 prompt 缓存（由客户端的 cache_control 标记驱动，
  # 在上游生效），不是网关层的响应缓存。两者是不同的东西。
  cache: false
  request_timeout: 600
  set_verbose: false
  json_logs: true
  drop_params: false
